<!DOCTYPE html>
<html lang="es">

<head>
    <title>Pago - SoftFriends</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles/base.css" />
    <link rel="stylesheet" type="text/css" href="styles/layout.css" />
    <link rel="stylesheet" type="text/css" href="styles/components.css" />
</head>

<body class="fondo-gris">

    <nav>
        <a class="logo" href="./index.html">
            <img src="img/logo.png" alt="Logo SoftFriends">
            <span>SoftFriends</span>
        </a>

        <ul>
            <li><a href="#"><img src="img/configuracion.png" alt="Icono de configuracion"></a></li>
            <li><a id="btn-perfil" href="#"><img src="img/iconoUsuario.png" alt="Icono de usuario"></a></li>
        </ul>
    </nav>

    <div class="contenedor-principal pago-layout">

        <main class="seccion-carrito-detalle">
            <header class="encabezado-carrito">
                <h1>Tu Pedido</h1>
                <button class="btn-agregar-mas" id="btn-volver-catalogo">+ Seguir Comprando</button>
            </header>

            <div class="contenedor-articulos" id="lista-pago-articulos">
                </div>
        </main>

        <aside class="seccion-resumen">
            <div class="tarjeta-blanca metodo-pago">
                <h3>Método de pago</h3>
                <div class="opciones-pago">
                    
                    <div class="opcion-pago activa" data-metodo="tarjeta">
                        <div class="radio-custom seleccionado"></div>
                        <img src="img/iconoTarjeta.png" alt="Tarjeta">
                        <span>Tarjeta (Crédito/Débito)</span>
                        <img src="img/palomitaRosa.png" class="icono-check" alt="Check">
                    </div>

                    <div class="opcion-pago" data-metodo="efectivo">
                        <div class="radio-custom"></div>
                        <img src="img/iconoEfectivo.png" alt="Efectivo">
                        <span>Efectivo</span>
                    </div>

                    <div class="opcion-pago" data-metodo="wallet">
                        <div class="radio-custom"></div>
                        <img src="img/iconoWallet.png" alt="Wallet">
                        <span>Wallet Digital</span>
                    </div>

                </div>
            </div>

            <div class="tarjeta-blanca resumen-compra">
                <h3>Resumen de Compra</h3>

                <div class="fila">
                    <span>Subtotal</span>
                    <span id="resumen-subtotal">$0.00</span>
                </div>
                <div class="fila descuento">
                    <span>Descuento</span>
                    <span id="resumen-descuento">-$0.00</span>
                </div>

                <div class="fila-total">
                    <strong>Total</strong>
                    <strong class="total-precio" id="resumen-total">$0.00</strong>
                </div>

                <button id="btn-procesar-pago" class="btn btn--primary" type="button">
                    <img src="img/iconoComprar.png" alt="" aria-hidden="true">
                    CONFIRMAR PAGO
                </button>
            </div>

        </aside>

    </div>

    <script type="module" src="js/app/pago.js"></script>
</body>

</html>
