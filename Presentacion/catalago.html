<!DOCTYPE html>
<html lang="es">

<head>
    <title>SoftFriends - Catalogo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles/base.css" />
    <link rel="stylesheet" type="text/css" href="styles/components.css" />
    <link rel="stylesheet" type="text/css" href="styles/layout.css" />
</head>

<body>

    <nav>
        <a class="logo" href="./index.html">
            <img src="img/logo.png" alt="Logo SoftFriends">
            <span>SoftFriends</span>
        </a>

        <form id="form-busqueda">
            <img src="img/iconoBuscar.png" alt="Icono de búsqueda" class="search-icon">
            <input id="txt_buscar" name="txt_buscar" type="text" placeholder="Search">
        </form>

        <ul>
            <li>
                <a href="#"><img src="img/configuracion.png" alt="Icono de configuracion"></a>
            </li>
            <li>
                <a id="btn-perfil" href="#"><img src="img/iconoUsuario.png" alt="Icono de usuario"></a>
            </li>
        </ul>
    </nav>

    <div class="contenedor-principal">

        <nav class="menu-lateral">
            <ul>
                <li>
                    <img src="img/iconoCatalago.png" alt="Icono catalogo">
                    <a href="#">Catálogo</a>
                </li>
                <li>
                    <img src="img/iconoFiltro.png" alt="Icono filtros">
                    <a href="#">Filtros</a>
                </li>
            </ul>
        </nav>

        <main>
            <section class="categorias">
                <ul id="lista-categorias">
                    <li><button class="active" data-categoria="todo">Todo</button></li>
                    <li>
                        <button data-categoria="marino">
                            <img src="img/gota.png" alt="Icono gota"> Marino
                        </button>
                    </li>
                    <li>
                        <button data-categoria="osos">
                            <img src="img/pinos.png" alt="Icono pinos"> Osos
                        </button>
                    </li>
                    <li>
                        <button data-categoria="mistico">
                            <img src="img/brillos.png" alt="Icono brillos"> Místico
                        </button>
                    </li>
                    <li>
                        <button data-categoria="dinosaurios">
                            <img src="img/gota.png" alt="Icono dinosaurios"> Dinosaurios
                        </button>
                    </li>
                </ul>
            </section>

            <section class="productos" id="contenedor-productos">
                </section>
        </main>

        <section class="carrito">
            <header>
                <h3>Carrito</h3>
                <button class="btn-secondary" id="btn-vaciar-carrito">BORRAR TODO</button>
                <p id="contador-carrito">0 artículos</p>
            </header>

            <div class="lista-carrito" id="contenedor-lista-carrito">
                </div>

            <footer>
                <div>
                    <span>Subtotal</span>
                    <span id="carrito-subtotal">$0.00</span>
                </div>
                <div>
                    <strong>Total</strong>
                    <strong class="total-precio" id="carrito-total">$0.00</strong>
                </div>
                <button class="btn btn--primary" id="btn-ir-pagar" type="button">
                    <img src="img/IconoAgregarCarrito.png" alt="" aria-hidden="true">
                    COMPRAR
                </button>
            </footer>
        </section>

    </div>

    <script type="module" src="js/app/catalogo.js"></script>
</body>

</html>
